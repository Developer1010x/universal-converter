[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-converter"
version = "1.1.0"
description = "Registry-driven file format conversion with multi-hop routing"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Prajwall Narayana", email = "sprajwalln.cs21@rvce.edu.in"}
]
keywords = ["converter", "convert", "format", "transform", "utility", "file-conversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# The core (JSON/CSV/TSV/XML/HTML/Markdown, GeoJSON/KML/GPX, FASTA/FASTQ/
# GenBank/BED/VCF, SQLite, Terraform, .env) runs on the standard library alone.
dependencies = []

# Every package below is imported by code in src/. `universal-convert --doctor`
# reports which of them are present and exactly how many conversions each one
# unlocks.
[project.optional-dependencies]
# YAML reading and writing (universal_converter.converters.data, .cloud)
data = ["PyYAML>=6.0"]

# TOML: reading uses stdlib tomllib on 3.11+, writing always needs tomli-w
toml = ["tomli-w>=1.0", "tomli>=2.0; python_version < '3.11'"]

# Raster image conversion, resize and thumbnails
images = ["Pillow>=9.0"]

# Word documents
docx = ["python-docx>=1.0"]

# PDF: pypdf reads, reportlab writes
pdf = ["pypdf>=4.0", "reportlab>=4.0"]

# Excel workbooks
xlsx = ["openpyxl>=3.1"]

# PyTorch -> ONNX model export (large download; excluded from `all`)
torch = ["torch>=2.0", "onnx>=1.15"]

# Everything except the multi-gigabyte torch stack
all = [
    "PyYAML>=6.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
    "Pillow>=9.0",
    "python-docx>=1.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "openpyxl>=3.1",
]

dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/Developer1010x/universal-converter"
Repository = "https://github.com/Developer1010x/universal-converter"
Issues = "https://github.com/Developer1010x/universal-converter/issues"

[project.scripts]
universal-convert = "universal_converter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
